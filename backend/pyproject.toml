[project]
name = "scholarqa"
version = "0.1.0"
description = "Research paper Q&A chatbot with graph RAG"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "pymupdf",
    "python-docx",
    "chromadb",
    "networkx",
    "google-genai",
    "sentence-transformers",
    "langchain-text-splitters",
    "pydantic",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["."]
include = ["rag*", "models*"]